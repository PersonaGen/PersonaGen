[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personagen"
version = "0.1.0"
description = "Population-aligned persona generation for LLM-based social simulation"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24.0",
  "openai>=1.37.0",
  "pandas>=2.0.0",
  "PyYAML>=6.0.0",
  "requests>=2.31.0",
  "scikit-learn>=1.3.0",
  "scipy>=1.10.0",
  "tqdm>=4.65.0",
]

[project.optional-dependencies]
embeddings = [
  "accelerate>=0.26.0",
  "sentence-transformers>=2.7.0",
  "transformers>=4.40.0",
]
serving = [
  "vllm>=0.5.4",
]

[project.urls]
Repository = "https://github.com/PersonaGen/PersonaGen"
Paper = "https://arxiv.org/abs/2509.10127"

[project.scripts]
personagen = "popalign.cli:main"
popalign = "popalign.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["popalign*"]
